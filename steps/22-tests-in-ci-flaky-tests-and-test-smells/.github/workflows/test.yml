# Runs on every push to main and on every pull request.
# GitHub reads workflows only from .github/workflows at the root of a repository:
# in your own InvoiceLite repository, this file goes there.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit and UI tests (Node ${{ matrix.node }}, shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci -- --shard=${{ matrix.shard }}/2

  integration:
    name: Integration tests (PostgreSQL in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:integration -- --ci
